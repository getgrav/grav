title: PLUGIN_ADMIN.MODULE
extends@: default

form:
  fields:
    tabs:
      type: tabs
      active: 1

      fields:
        content:
          fields:

            modular_title:
              type: spacer
              title: PLUGIN_ADMIN.MODULE_SETUP

            header.content.items:
              type: text
              label: PLUGIN_ADMIN.ITEMS
              default: '@self.modular'
              size: medium

            header.content.order.by:
              type: text
              label: PLUGIN_ADMIN.ORDER_BY
              placeholder: date
              help:
              size: small

            header.content.order.dir:
              type: text
              label: PLUGIN_ADMIN.ORDER
              help: PLUGIN_ADMIN.ORDER_DIR_HELP
              placeholder: desc
              size: small

            header.cache_modules:
              type: toggle
              toggleable: true
              label: PLUGIN_ADMIN.CACHE_MODULES
              help: PLUGIN_ADMIN.CACHE_MODULES_HELP
              highlight: 0
              options:
                1: PLUGIN_ADMIN.YES
                0: PLUGIN_ADMIN.NO
              validate:
                type: bool
